; TrekSafe node firmware.
;
; One codebase, three roles, two transports. Which combination you get is fixed
; at build time by the environment you choose, so a build is reproducible from
; its name and a board is flashed as exactly one thing. See the note at the top
; of src/main.cpp on why that is not configurable at runtime.
;
;   pio run -e beacon-serial -t upload      the one-board demo
;   pio run -e beacon-lora   -t upload      a real beacon, needs a second board
;   pio run -e repeater      -t upload      a relay
;   pio run -e gateway       -t upload      the radio beside the base station
;
; Add -t monitor to watch a board talk. 115200 baud.

[platformio]
default_envs = beacon-serial

; ---------------------------------------------------------------------------
; Shared by every environment
; ---------------------------------------------------------------------------
[env]
platform = espressif32
framework = arduino

; src/probe.cpp is a standalone hardware identification tool with its own
; setup() and loop(). It must never be compiled into a real build, so every
; environment except boardprobe excludes it.
build_src_filter = +<*> -<probe.cpp>

; The Heltec WiFi LoRa 32 V3 board definition: ESP32-S3 with an SX1262.
;
; PlatformIO has no definition for a "V4". If the board on the bench turns out
; to differ in a way this definition gets wrong, the fix is almost certainly in
; boards/heltec_v4.h rather than here, because everything this line decides is
; the chip, the flash layout and the upload protocol, and those are shared
; across the revisions. The pin map is the part that moves.
board = heltec_wifi_lora_32_V3

monitor_speed = 115200
upload_speed = 921600

; RadioLib drives the SX1262. Pinned to a major version: this is a safety
; system, and a radio driver silently changing underneath it between builds is
; not a risk worth taking for the convenience of automatic updates.
lib_deps =
    jgromes/RadioLib @ ^7.0.0
    ; The 128x64 panel on the front of the board. It is an SSD1315, which is
    ; register compatible with the SSD1306 this drives. Pinned for the same
    ; reason RadioLib is: a display library changing underneath a safety system
    ; between builds is not worth the convenience of automatic updates.
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1

build_flags =
    -Wall
    -Wextra
    -std=gnu++11
    ; Route Serial to the USB cable rather than to the physical UART pins.
    ;
    ; This is not optional and it is the single most confusing thing about this
    ; chip. On an ESP32-S3, `Serial` defaults to UART0, which is a pair of pins
    ; on the header that nothing is connected to. Everything the firmware prints
    ; goes there, the USB cable carries nothing at all, and the board looks
    ; completely dead while running perfectly.
    ;
    ; Found by flashing and getting silence. The board definition sets
    ; ARDUINO_USB_MODE=1 but not this, so it has to be set here.
    ;
    ; For beacon-serial it is more than a logging convenience: that build's
    ; whole transport is the USB cable, so without this the beacon transmits
    ; into a pin header and the demonstration cannot work at all.
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; The one-board demonstration
; ---------------------------------------------------------------------------
;
; A beacon whose radio is the USB cable. Press the button and the frame it would
; have transmitted comes up the cable instead, where sim/ plays the part of the
; repeaters and the gateway. Everything above the transport behaves exactly as
; it would on the air.
;
; It reports a fixed position because no GPS is fitted. That is announced in the
; log at startup and the simulator marks it as simulated all the way through to
; the console, so nothing invented here is ever shown to a warden as a
; measurement.
[env:beacon-serial]
build_flags =
    ${env.build_flags}
    -DTREKSAFE_ROLE_BEACON
    -DTREKSAFE_TRANSPORT_SERIAL
    -DTREKSAFE_SIMULATED_POSITION
    ; Maligne Lake, Jasper National Park. Chosen because it is the sort of place
    ; this product is for: a long valley, a day's walk from a road, and no
    ; mobile coverage.
    -DTREKSAFE_SIM_LAT=52.7211
    -DTREKSAFE_SIM_LON=-117.6413

; ---------------------------------------------------------------------------
; Real hardware
; ---------------------------------------------------------------------------

; A beacon on the air. Needs something to receive it, so this is the build to
; use once there is a second board.
[env:beacon-lora]
build_flags =
    ${env.build_flags}
    -DTREKSAFE_ROLE_BEACON
    -DTREKSAFE_TRANSPORT_LORA

; A relay. No button, no GPS, reports its own health so a dying one is known
; about while somebody can still walk up there in daylight.
[env:repeater]
build_flags =
    ${env.build_flags}
    -DTREKSAFE_ROLE_REPEATER
    -DTREKSAFE_TRANSPORT_LORA

; The radio beside the computer running the console. Radio on one side, USB
; cable on the other, and no opinion about what any of it means.
[env:gateway]
build_flags =
    ${env.build_flags}
    -DTREKSAFE_ROLE_GATEWAY
    -DTREKSAFE_TRANSPORT_LORA

; ---------------------------------------------------------------------------
; Bench
; ---------------------------------------------------------------------------
;
; A beacon that raises a distress call fifteen seconds after boot and then
; behaves exactly as it would after a real press. For testing the path end to
; end without having to be holding the board.
;
; It says what it is in the log, every time it fires. A build with this set is
; not a beacon.
[env:beacon-serial-selftrigger]
build_flags =
    ${env:beacon-serial.build_flags}
    -DTREKSAFE_TRIGGER_AFTER_MS=15000


; ---------------------------------------------------------------------------
; Board identification
; ---------------------------------------------------------------------------
;
; Asks the hardware which board it is. Run this on an unknown board before
; trusting any pin map:
;
;     pio run -e boardprobe -t upload -t monitor
;
; It drives no radio and writes nothing but itself. See src/probe.cpp for what
; it determines and why it is needed at all.
[env:boardprobe]
build_src_filter = -<*> +<probe.cpp>
build_flags =
    ${env.build_flags}
